<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f7fb">
<title>URL QR 코드 만들기</title>
<style>
  :root{color-scheme:light;--ink:#202438;--muted:#73798d;--line:#e5e8f0;--accent:#6258e8;--accent2:#5147d3;--bg:#f6f7fb}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,#eeedff 0,transparent 32%),var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);display:flex;flex-direction:column}
  header{width:min(100% - 32px,920px);margin:26px auto 0;display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em}
  .logo{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:white;box-shadow:0 7px 18px #6258e83b}
  main{width:min(100% - 32px,620px);margin:auto;padding:44px 0 54px}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--accent);background:#eeedff;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800}
  h1{font-size:clamp(30px,6vw,43px);line-height:1.18;letter-spacing:-.055em;margin:18px 0 12px}
  .intro{color:var(--muted);line-height:1.7;margin:0 0 28px;font-size:15px}
  .panel{background:#fff;border:1px solid #eaecf3;border-radius:24px;padding:clamp(20px,5vw,30px);box-shadow:0 18px 55px #29305a0d}
  label{display:block;font-weight:750;font-size:14px;margin-bottom:10px}
  .input-wrap{display:flex;gap:9px}
  input{width:100%;min-width:0;border:1px solid #dfe2ec;border-radius:13px;padding:15px 14px;font-size:15px;outline:none;color:var(--ink);transition:.2s}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 4px #6258e817}
  button{font:inherit;cursor:pointer;border:0;border-radius:13px;font-weight:750;transition:transform .15s,background .15s}
  button:active{transform:scale(.98)}
  .primary{background:var(--accent);color:#fff;padding:0 20px;white-space:nowrap}
  .primary:hover{background:var(--accent2)}
  .hint{font-size:12px;color:var(--muted);margin:9px 0 0;line-height:1.5}
  .error{display:none;color:#c0364d;font-size:13px;margin:12px 0 0}
  .result{display:none;margin-top:24px;padding-top:24px;border-top:1px solid var(--line);text-align:center}
  .result.show{display:block}
  .qr-frame{width:240px;height:240px;margin:0 auto 17px;border:1px solid var(--line);border-radius:18px;display:grid;place-items:center;background:white;padding:12px}
  #qr{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
  .result-title{font-size:17px;font-weight:800;margin:0 0 7px}
  .result-url{font-size:13px;color:var(--muted);overflow-wrap:anywhere;margin:0 auto 17px;max-width:440px;line-height:1.5}
  .actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
  .secondary{background:#f0f1f8;color:var(--ink);padding:12px 16px}
  .secondary:hover{background:#e7e8f2}
  .status{min-height:18px;font-size:12px;color:#24845d;margin-top:12px}
  footer{text-align:center;color:#969bad;font-size:12px;padding:0 16px 22px}
  @media(max-width:480px){header{margin-top:18px}.input-wrap{flex-direction:column}.primary{padding:14px}.qr-frame{width:220px;height:220px}main{padding-top:34px}}
</style>
</head>
<body>
<header><div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"/></svg></div> 링크큐 · Link QR</header>
<main>
  <div class="eyebrow"><span>✦</span> FREE QR GENERATOR</div>
  <h1>링크를 QR 코드로<br>간편하게 바꿔보세요.</h1>
  <p class="intro">URL을 입력하고 버튼을 누르면 바로 QR 코드가 생성됩니다.<br>휴대폰 카메라로 스캔해 링크를 열 수 있어요.</p>
  <section class="panel" aria-label="QR 코드 생성기">
    <form id="qrForm">
      <label for="urlInput">변환할 URL</label>
      <div class="input-wrap">
        <input id="urlInput" type="text" inputmode="url" autocomplete="url" placeholder="https://example.com" aria-describedby="urlHint" required>
        <button class="primary" type="submit">QR 만들기 <span aria-hidden="true">↗</span></button>
      </div>
      <p class="hint" id="urlHint">예: https://www.google.com · http:// 또는 https:// 주소를 입력해 주세요.</p>
      <p class="error" id="errorMsg" role="alert"></p>
    </form>
    <div class="result" id="result" aria-live="polite">
      <div class="qr-frame"><img id="qr" alt="입력한 URL의 QR 코드"></div>
      <p class="result-title">QR 코드가 완성됐어요!</p>
      <p class="result-url" id="resultUrl"></p>
      <div class="actions">
        <button class="secondary" id="downloadBtn" type="button">↓ 이미지 저장</button>
        <button class="secondary" id="copyBtn" type="button">▢ URL 복사</button>
      </div>
      <div class="status" id="status" role="status"></div>
    </div>
  </section>
</main>
<footer>간단하고 빠른 URL QR 코드 생성기</footer>
<script>
(() => {
  const form = document.getElementById('qrForm');
  const input = document.getElementById('urlInput');
  const result = document.getElementById('result');
  const qr = document.getElementById('qr');
  const error = document.getElementById('errorMsg');
  const resultUrl = document.getElementById('resultUrl');
  const status = document.getElementById('status');
  let currentUrl = '';

  function normalizeUrl(raw) {
    let value = raw.trim();
    if (!value) throw new Error('URL을 입력해 주세요.');
    if (!/^https?:\/\//i.test(value)) value = 'https://' + value;
    let parsed;
    try { parsed = new URL(value); } catch (_) { throw new Error('올바른 URL인지 확인해 주세요.'); }
    if (!['http:', 'https:'].includes(parsed.protocol) || !parsed.hostname.includes('.')) {
      throw new Error('http:// 또는 https://로 시작하는 올바른 웹 주소를 입력해 주세요.');
    }
    return parsed.href;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    error.style.display = 'none';
    status.textContent = '';
    try {
      currentUrl = normalizeUrl(input.value);
      resultUrl.textContent = currentUrl;
      // QR image is generated by a public QR endpoint; the entered URL is encoded as data.
      qr.src = 'https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=12&data=' + encodeURIComponent(currentUrl);
      result.classList.add('show');
      qr.alt = 'QR 코드: ' + currentUrl;
    } catch (err) {
      result.classList.remove('show');
      error.textContent = err.message || 'URL을 확인해 주세요.';
      error.style.display = 'block';
    }
  });

  document.getElementById('downloadBtn').addEventListener('click', async () => {
    if (!currentUrl) return;
    try {
      const response = await fetch(qr.src);
      if (!response.ok) throw new Error('이미지를 가져오지 못했습니다.');
      const blob = await response.blob();
      const objectUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objectUrl;
      a.download = 'url-qr-code.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(objectUrl);
      status.textContent = 'QR 이미지 저장을 시작했어요.';
    } catch (_) {
      window.open(qr.src, '_blank', 'noopener');
      status.textContent = '새 탭에서 QR 이미지를 열었어요. 이미지를 길게 눌러 저장해 주세요.';
    }
  });

  document.getElementById('copyBtn').addEventListener('click', async () => {
    if (!currentUrl) return;
    try {
      await navigator.clipboard.writeText(currentUrl);
      status.textContent = 'URL을 복사했어요.';
    } catch (_) {
      const temp = document.createElement('textarea');
      temp.value = currentUrl;
      temp.style.position = 'fixed';
      temp.style.opacity = '0';
      document.body.appendChild(temp);
      temp.select();
      const ok = document.execCommand('copy');
      temp.remove();
      status.textContent = ok ? 'URL을 복사했어요.' : '복사에 실패했어요. URL을 직접 선택해 주세요.';
    }
  });
})();
</script>
</body>
</html>
